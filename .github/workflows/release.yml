name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Skip if release already exists
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping upload so signed assets are preserved."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        if: steps.release_guard.outputs.skip != 'true'
        run: |
          set -eu
          for spec in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${spec%%/*}
            arch=${spec#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "statuspan-${os}-${arch}" ./cmd/statuspan
          done
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 statuspan-darwin-arm64 statuspan-darwin-amd64 statuspan-linux-amd64 statuspan-linux-arm64 > SHA256SUMS
          else
            sha256sum statuspan-darwin-arm64 statuspan-darwin-amd64 statuspan-linux-amd64 statuspan-linux-arm64 > SHA256SUMS
          fi

      - name: Publish release
        if: steps.release_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            statuspan-darwin-arm64 \
            statuspan-darwin-amd64 \
            statuspan-linux-amd64 \
            statuspan-linux-arm64 \
            SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "Binaries for ${GITHUB_REF_NAME}. SHA256SUMS lists the binaries. Install with: curl -fsSL https://statuspan.com/install.sh | sh"
